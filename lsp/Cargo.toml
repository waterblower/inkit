[package]
name = "ink-lsp"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.26.6"
tree-sitter-language = "0.1"
url = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = "0.47"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
